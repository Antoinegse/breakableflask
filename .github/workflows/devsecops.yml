name: Automatisation des tests DevSecOps
on: push
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Trivy
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Dependances
        run: | 
          trivy fs \ 
            --scanners vuln \ 
            --severity HIGH,CRITICAL \ 
            --exit-code 1 \ 
            --no-progress \ 
            .
            
  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Installer Trivy 
        uses: aquasecurity/setup-trivy@v0.2.3
    
      - name: Test Dockerfile
        run: | 
          trivy config \ 
            --file-patterns 'dockerfile:Dockerfile' \ 
            --severity HIGH,CRITICAL \ 
            --exit-code 1 \ 
            --no-progress \ .
  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
